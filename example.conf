# Example wg-quick config for kwg. Replace the placeholders with your own values.
[Interface]
PrivateKey = <client-private-key>
Address = 10.0.0.2/32
DNS = 10.0.0.1

[Peer]
PublicKey = <server-public-key>
# PresharedKey = <optional-preshared-key>
Endpoint = vpn.example.com:51820
# Full tunnel; for split tunnel list only your networks, e.g. 192.168.1.0/24
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
